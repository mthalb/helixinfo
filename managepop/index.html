<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>POPUP CONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#120A04; --void-2:#1A0F06; --panel:#1F1409; --panel-2:#2A1B0C;
    --line:#4A2E13; --line-soft:#3A260F; --flare:#FF7A18; --flare-2:#FF4D1C;
    --signal:#FFD400; --bone:#FFF6E9; --dim:#D9AF80; --blood:#FF4747; --ok:#3FFFA0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--void);color:var(--bone);font-family:'IBM Plex Mono', monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  h1,h2,.display{font-family:'Rajdhani', sans-serif;font-weight:700;letter-spacing:0.02em;margin:0;}
  .card{width:100%;max-width:460px;background:linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);border:1px solid var(--line);border-radius:2px;padding:28px;box-shadow:0 24px 70px -20px rgba(255,90,20,0.22), 0 20px 60px -20px rgba(0,0,0,0.6);}
  .brand{font-size:12px;color:var(--signal);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:6px;font-weight:700;}
  h1{font-size:26px;margin-bottom:20px;}
  label{display:block;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px;margin-top:16px;}
  input, textarea{background:var(--void-2);border:1px solid var(--line);color:var(--bone);padding:12px 13px;font-family:'IBM Plex Mono', monospace;font-size:14px;width:100%;outline:none;border-radius:2px;}
  input:focus, textarea:focus{border-color:var(--flare);box-shadow:0 0 0 3px rgba(255,122,24,0.20);}
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .row label{margin:0;}
  button{font-family:'Rajdhani', sans-serif;font-weight:800;font-size:15px;letter-spacing:0.06em;text-transform:uppercase;padding:12px 20px;cursor:pointer;border-radius:2px;border:none;margin-top:20px;width:100%;}
  .go{background:linear-gradient(100deg, var(--flare) 0%, var(--flare-2) 100%);color:var(--void);box-shadow:0 6px 24px -6px rgba(255,90,20,0.6);}
  .go:hover{filter:brightness(1.12);}
  .go:disabled{opacity:0.6;cursor:not-allowed;}
  .danger{background:transparent;color:var(--blood);border:1px solid var(--blood);margin-top:10px;}
  .danger:hover{background:rgba(255,71,71,0.08);}
  .danger:disabled{opacity:0.6;cursor:not-allowed;}
  .status{margin-top:14px;font-size:12.5px;min-height:18px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--blood);}
  .preview{margin-top:16px;border:1px solid var(--line-soft);border-radius:2px;overflow:hidden;background:var(--void-2);display:none;}
  .preview img{width:100%;display:block;max-height:260px;object-fit:contain;}
  .hint{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5;}
</style>
</head>
<body>

<div class="card">
  <div class="brand">// POPUP CONTROL — FREEFIRE INFO</div>
  <h1>Site Popup</h1>

  <label for="imgUrl">Image URL</label>
  <input id="imgUrl" type="text" placeholder="https://example.com/image.png">

  <label for="caption">Caption (optional)</label>
  <textarea id="caption" placeholder="Announcement text shown under the image"></textarea>

  <div class="row">
    <input type="checkbox" id="activeToggle" style="width:auto;">
    <label for="activeToggle" style="margin:0;">Popup active (shown to visitors)</label>
  </div>

  <div class="preview" id="previewWrap">
    <img id="previewImg" alt="preview">
  </div>

  <button class="go" id="publishBtn">Publish</button>
  <button class="danger" id="clearBtn">Deactivate Popup</button>

  <div class="status" id="panelStatus"></div>
  <div class="hint">Writes directly to <code>popup/current</code> in the site's Firebase Realtime Database. Visitors see the popup on next page load while "active" is checked. This page has no login — keep its URL private and don't link to it anywhere on the public site.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAOrJgxlbOUaezajJL5q_yRdazwKxf0XUM",
    authDomain: "helixinfo.firebaseapp.com",
    databaseURL: "https://helixinfo-default-rtdb.firebaseio.com",
    projectId: "helixinfo",
    storageBucket: "helixinfo.firebasestorage.app",
    messagingSenderId: "643923715533",
    appId: "1:643923715533:web:8259b583f8be8ce7441084"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const popupRef = ref(db, 'popup/current');

  const imgUrl = document.getElementById('imgUrl');
  const caption = document.getElementById('caption');
  const activeToggle = document.getElementById('activeToggle');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('previewImg');
  const panelStatus = document.getElementById('panelStatus');
  const publishBtn = document.getElementById('publishBtn');
  const clearBtn = document.getElementById('clearBtn');

  function setStatus(msg, ok){
    panelStatus.textContent = msg;
    panelStatus.className = 'status ' + (ok ? 'ok' : 'err');
    setTimeout(() => { panelStatus.textContent = ''; }, 3500);
  }

  function updatePreview(){
    if(imgUrl.value.trim()){
      previewImg.src = imgUrl.value.trim();
      previewWrap.style.display = '';
    }else{
      previewWrap.style.display = 'none';
    }
  }
  imgUrl.addEventListener('input', updatePreview);

  async function loadCurrent(){
    try{
      const snap = await get(popupRef);
      if(snap.exists()){
        const d = snap.val();
        imgUrl.value = d.imageUrl || '';
        caption.value = d.caption || '';
        activeToggle.checked = !!d.active;
        updatePreview();
      }
    }catch(e){
      setStatus('Could not load current popup.', false);
    }
  }
  loadCurrent();

  publishBtn.addEventListener('click', async () => {
    if(!imgUrl.value.trim()){ setStatus('Add an image URL first.', false); return; }
    publishBtn.disabled = true;
    try{
      await set(popupRef, {
        imageUrl: imgUrl.value.trim(),
        caption: caption.value.trim(),
        active: activeToggle.checked,
        updatedAt: Date.now()
      });
      setStatus('Published.', true);
    }catch(e){
      setStatus('Failed to publish: ' + e.message, false);
    }finally{
      publishBtn.disabled = false;
    }
  });

  clearBtn.addEventListener('click', async () => {
    activeToggle.checked = false;
    clearBtn.disabled = true;
    try{
      await set(popupRef, {
        imageUrl: imgUrl.value.trim(),
        caption: caption.value.trim(),
        active: false,
        updatedAt: Date.now()
      });
      setStatus('Popup deactivated.', true);
    }catch(e){
      setStatus('Failed: ' + e.message, false);
    }finally{
      clearBtn.disabled = false;
    }
  });
</script>
</body>
</html>
